# Self-hosted Umanity: Postgres + app + Caddy (automatic HTTPS).
# 1. cp .env.example .env  (fill DATABASE_URL=postgres://umanity:umanity@db:5432/umanity and the signers)
# 2. set DOMAIN in .env (e.g. DOMAIN=umanity.xyz)
# 3. docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: umanity
      POSTGRES_PASSWORD: umanity
      POSTGRES_DB: umanity
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U umanity']
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://umanity:umanity@db:5432/umanity
      UPLOAD_DIR: /app/.data/uploads
    volumes:
      - appdata:/app/.data
    depends_on:
      db:
        condition: service_healthy
    expose:
      - '3000'

  # Credits cross-chain gifts whose donors closed the tab (NEAR Intents status sweep).
  reconcile:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    env_file: .env
    depends_on:
      - app
    entrypoint: ['/bin/sh', '-c', 'while true; do curl -fsS -H "authorization: Bearer $${CRON_SECRET}" http://app:3000/api/intents/reconcile > /dev/null || true; sleep 90; done']

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  appdata:
  caddy_data:
  caddy_config:
