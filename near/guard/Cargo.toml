[package]
name = "umanity-guard"
description = "NEAR holds the rules for Umanity's Solana pots: an AI-checked, council-vetoable release, signed by NEAR Chain Signatures."
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/shariqazeem/umanity"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"
bs58 = "0.5"
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
ed25519-dalek = "2"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

# A crate of its own, outside the Anchor workspace at the repo root.
[workspace]
